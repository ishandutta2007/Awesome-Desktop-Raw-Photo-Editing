<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Keyframe Animations */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, -30px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 40px) scale(1.1); }
    }
    @keyframes pulseAperture {
      0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.85; }
      50% { transform: rotate(180deg) scale(1.06); opacity: 1; }
    }
    @keyframes waveWaveform {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 40; }
    }
    @keyframes shimmerPill {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }

    .animated-orb1 { animation: floatOrb1 14s ease-in-out infinite; }
    .animated-orb2 { animation: floatOrb2 18s ease-in-out infinite; }
    .animated-aperture { transform-origin: 1040px 210px; animation: pulseAperture 22s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .animated-shimmer { animation: shimmerPill 4s ease-in-out infinite; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Viewfinder Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Glowing Ambient Background Orbs -->
  <circle class="animated-orb1" cx="200" cy="100" r="180" fill="url(#orbGrad1)" filter="url(#glow)" />
  <circle class="animated-orb2" cx="1020" cy="300" r="210" fill="url(#orbGrad2)" filter="url(#glow)" />

  <!-- Dynamic Geometric RAW Aperture Symbol (Right Side Background) -->
  <g class="animated-aperture" opacity="0.45">
    <circle cx="1040" cy="210" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="1040" cy="210" r="105" fill="none" stroke="#818cf8" stroke-width="3" />
    <circle cx="1040" cy="210" r="70" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="12 6" />
    
    <!-- Aperture Blades -->
    <path d="M 1040 105 L 1115 170" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 1115 170 L 1115 260" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 1115 260 L 1040 315" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 1040 315 L 965 260" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 965 260 L 965 170" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 965 170 L 1040 105" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Center Sensor Point -->
    <circle cx="1040" cy="210" r="8" fill="#38bdf8" />
  </g>

  <!-- Subtle Camera Viewfinder Focus Corners -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 40 50 L 40 40 L 50 40" />
    <path d="M 1160 50 L 1160 40 L 1150 40" />
    <path d="M 40 370 L 40 380 L 50 380" />
    <path d="M 1160 370 L 1160 380 L 1150 380" />
  </g>

  <!-- Foreground Content Group (Guaranteed High Contrast & Readability) -->
  <g transform="translate(60, 0)">
    
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 58)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" class="font-mono" font-size="12" fill="#94a3b8" letter-spacing="1.5">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="font-title" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Desktop RAW Photo Editing
    </text>

    <!-- Subtitle -->
    <text x="0" y="188" class="font-sub" font-size="20" fill="#f1f5f9">
      Professional Digital Darkrooms, Open-Source Pipelines &amp; Color Grading Workflows
    </text>

    <!-- Description / Tagline -->
    <text x="0" y="224" class="font-sub" font-size="14.5" fill="#94a3b8" max-width="700">
      A definitive directory of industry SaaS powerhouses, mature open-source RAW developers,
    </text>
    <text x="0" y="246" class="font-sub" font-size="14.5" fill="#94a3b8">
      high-speed decoding engines (LibRaw, Rawspeed), and non-destructive image workflows.
    </text>

    <!-- Interactive/Dynamic Feature Chips -->
    <g transform="translate(0, 290)">
      <!-- Chip 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
        <text x="20" y="26" class="font-sub" font-size="13" font-weight="600" fill="#e0f2fe">📷 Commercial Giants</text>
      </g>

      <!-- Chip 2: Open Source -->
      <g transform="translate(195, 0)" class="animated-shimmer">
        <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
        <text x="20" y="26" class="font-sub" font-size="13" font-weight="600" fill="#ede9fe">⚡ Open-Source Suites</text>
      </g>

      <!-- Chip 3: Color & Science -->
      <g transform="translate(405, 0)">
        <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />
        <text x="20" y="26" class="font-sub" font-size="13" font-weight="600" fill="#fae8ff">🎨 Color Management</text>
      </g>

      <!-- Chip 4: 100% Offline -->
      <g transform="translate(615, 0)">
        <rect width="170" height="42" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.9" />
        <text x="20" y="26" class="font-sub" font-size="13" font-weight="600" fill="#d1fae5">🔒 Local &amp; Private</text>
      </g>
    </g>

    <!-- Bottom Meta Line -->
    <g transform="translate(0, 368)">
      <text x="0" y="0" class="font-mono" font-size="12" fill="#64748b">
        [RAW] · [DNG] · [CR3] · [NEF] · [ARW] · [RAF] · Non-Destructive Scene-Referred Pipeline
      </text>
    </g>

  </g>
</svg>
